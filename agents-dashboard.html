      { id: "general", name: "general", persona: "רב-תכליתי — משימות מורכבות מרובות שלבים שאין להן סוכן ייעודי", avatar: "🧠", color: "#64748b", colorLight: "#94a3b8", executor: { type: "real", name: "general", desc: "סוכן OpenCode: general — משימות כלליות מורכבות" }, tags: ["General", "Multi-step", "Fallback"] },

    ]

];

let selectedAgent = null;

const teamsGrid = document.getElementById("teamsGrid");
const modalOverlay = document.getElementById("modalOverlay");
const modalClose = document.getElementById("modalClose");
const btnCancel = document.getElementById("btnCancel");
const btnActivate = document.getElementById("btnActivate");
const toast = document.getElementById("toast");

function renderTeams() {
  teamsGrid.innerHTML = TEAMS.map(team => `
    <section class="team-card" style="--team-color: ${team.color}; --team-color-light: ${team.colorLight};">
      <div class="team-header">
        <div class="team-icon" style="background: linear-gradient(135deg, ${team.color}, ${team.colorLight});">${team.icon}</div>
        <div>
          <div class="team-name">${team.name}</div>
          <div class="team-desc">${team.agents.length} פרסונות</div>
        </div>
      </div>
      <div class="agents-list">
        ${team.agents.map(agent => {
          const exec = agent.executor;
          const isReal = exec.type === "real";
          const badgeClass = isReal ? "real" : "me";
          const badgeText = isReal ? "סוכן אמיתי" : "אני מבצע";
          return `
          <button class="agent-btn" data-agent-id="${agent.id}" data-team-id="${team.id}" style="--agent-color: ${agent.color}; --agent-color-light: ${agent.colorLight};" aria-label="פרטים על ${agent.name}">
            <div class="agent-main">
              <div class="agent-avatar" style="background: linear-gradient(135deg, ${agent.color}, ${agent.colorLight});">${agent.avatar}</div>
              <div class="agent-info">
                <div class="agent-name-row">
                  <span class="agent-name">${agent.name}</span>
                  <span class="agent-role-tag ${badgeClass}">${badgeText}</span>
                </div>
                <div class="agent-role-text">${agent.persona}</div>
              </div>
            </div>
            <div class="agent-executor">
              <span class="executor-label">מבצע בפועל:</span>
              <span class="executor-badge ${badgeClass}">${exec.name}</span>
            </div>
          </button>
        `}).join("")}
      </div>
    </section>
  `).join("");

  document.querySelectorAll(".agent-btn").forEach(btn => {
    btn.addEventListener("click", () => openModal(btn.dataset.agentId, btn.dataset.teamId));
    btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btn.click(); } });
  });
}

function findAgent(agentId, teamId) {
  const team = TEAMS.find(t => t.id === teamId);
  return team?.agents.find(a => a.id === agentId);
}

function openModal(agentId, teamId) {
  const agent = findAgent(agentId, teamId);
  const team = TEAMS.find(t => t.id === teamId);
  if (!agent || !team) return;

  selectedAgent = { agent, team };

  document.getElementById("modalAvatar").textContent = agent.avatar;
  document.getElementById("modalAvatar").style.setProperty("--modal-agent-color", agent.color);
  document.getElementById("modalAvatar").style.setProperty("--modal-agent-color-light", agent.colorLight);
  document.getElementById("modalTitle").textContent = agent.name;
  document.getElementById("modalTeam").textContent = team.name;
  
  const exec = agent.executor;
  const isReal = exec.type === "real";
  const badgeClass = isReal ? "real" : "me";
  const badgeText = isReal ? "סוכן OpenCode אמיתי" : "הסוכן הראשי (אני)";
  document.getElementById("modalExecutor").innerHTML = `
    <strong>מי מבצע בפועל:</strong>
    <span class="executor-badge ${badgeClass}" style="margin-top: 0.5rem; display: inline-block;">${exec.name}</span>
    <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted);">${exec.desc}</div>
  `;
  
  document.getElementById("modalRole").textContent = agent.persona;
  document.getElementById("modalTags").innerHTML = agent.tags.map(t => `<span class="tag">${t}</span>`).join("");
  document.getElementById("btnActivate").style.background = `linear-gradient(135deg, ${agent.color}, ${agent.colorLight})`;
  document.getElementById("btnActivate").textContent = isReal ? "הפעל סוכן OpenCode" : "אני אבצע את זה";

  modalOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
  btnActivate.focus();
}

function closeModal() {
  modalOverlay.classList.remove("open");
  document.body.style.overflow = "";
  selectedAgent = null;
}

function showToast(agent, team) {
  const toastAvatar = document.getElementById("toastAvatar");
  const toastText = document.getElementById("toastText");
  toastAvatar.textContent = agent.avatar;
  toastAvatar.style.setProperty("--toast-color", agent.color);
  toastAvatar.style.setProperty("--toast-color-light", agent.colorLight);
  const exec = agent.executor;
  toastText.textContent = `${exec.type === "real" ? "🤖" : "🧠"} ${agent.name} — מבוצע ע״י ${exec.name}`;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 3500);
}

function activateAgent() {
  if (!selectedAgent) return;
  const { agent, team } = selectedAgent;
  closeModal();
  showToast(agent, team);
  console.log(`[ACTIVATE] ${agent.name} (${agent.id}) from ${team.name} — Executor: ${agent.executor.name} (${agent.executor.type})`);
}

modalClose.addEventListener("click", closeModal);
btnCancel.addEventListener("click", closeModal);
btnActivate.addEventListener("click", activateAgent);
modalOverlay.addEventListener("click", e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal(); });

renderTeams();
const totalPersonas = TEAMS.reduce((sum, t) => sum + t.agents.length, 0);
const realCount = TEAMS.flatMap(t => t.agents).filter(a => a.executor.type === "real").length;
const meCount = totalPersonas - realCount;
console.log("לוח סוכנים נטען —", totalPersonas, "פרסונות ב־", TEAMS.length, "צוותים");
console.log("מבוצעים ע״י סוכני OpenCode אמיתיים:", realCount, "| מבוצעים על ידי הסוכן הראשי:", meCount);
</script>
