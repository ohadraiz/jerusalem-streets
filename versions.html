<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>מעקב גרסאות וגיבויים — יומן הרחובות של ירושלים</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f4ef; --bg-soft: #ffffff; --fg: #1f1b16; --muted: #675d52;
    --border: #d9cfc4; --accent: #9b5f24; --accent-soft: #fff2e3;
    --ok: #2f7d32; --ok-soft: #e8f5e9; --warn: #a05a00; --warn-soft: #fff4e0;
    --shadow: 0 8px 28px rgba(0,0,0,.08);
    --mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --focus: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --bg-soft: #1d1a16; --fg: #f2eee9; --muted: #b9b0a6;
      --border: #3a332c; --accent: #e39a53; --accent-soft: rgba(227,154,83,.16);
      --ok: #7cc47f; --ok-soft: rgba(124,196,127,.14); --warn: #e0b168; --warn-soft: rgba(224,177,104,.14);
      --shadow: 0 8px 28px rgba(0,0,0,.4); --focus: #f0b35c;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--fg);
    margin: 0; padding: 2rem 1rem; line-height: 1.6;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 0 0 .4rem; }
  .sub { color: var(--muted); font-size: 1rem; }
  .current {
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px;
    padding: 1.25rem; margin-bottom: 2rem; text-align: center;
  }
  .current .badge { display: inline-block; font-family: var(--mono); font-weight: 700; font-size: 1.6rem; color: var(--accent); }
  .current .meta { color: var(--muted); font-size: .9rem; margin-top: .35rem; }
  .versions { display: flex; flex-direction: column; gap: 1rem; }
  .version {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.25rem; box-shadow: var(--shadow);
  }
  .version__head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .version__num { font-family: var(--mono); font-weight: 700; font-size: 1.25rem; color: var(--accent); }
  .version__label { font-weight: 700; font-size: 1.05rem; }
  .version__date { color: var(--muted); font-size: .9rem; }
  .pill { font-size: .78rem; font-weight: 700; padding: .2rem .6rem; border-radius: 999px; }
  .pill--active { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
  .pill--archived { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
  .version__changes { margin: .5rem 0 .75rem; padding-inline-start: 1.2rem; }
  .version__changes li { margin-bottom: .25rem; }
  .version__meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .85rem; color: var(--muted); border-top: 1px dashed var(--border); padding-top: .65rem; }
  .version__meta code { font-family: var(--mono); color: var(--fg); background: var(--bg); padding: .1rem .35rem; border-radius: 4px; border: 1px solid var(--border); }
  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 2.5rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>מעקב גרסאות וגיבויים</h1>
    <p class="sub">יומן הרחובות של ירושלים — היסטוריית גרסאות, גיבויים ו-commits</p>
  </header>

  <section class="current" aria-labelledby="current-title">
    <h2 id="current-title" style="margin:0; font-size:1rem; color:var(--muted);">הגרסה הנוכחית</h2>
    <div class="badge" id="currentVersion">—</div>
    <div class="meta" id="currentMeta">—</div>
  </section>

  <section aria-labelledby="history-title">
    <h2 id="history-title" style="font-size:1.15rem;">היסטוריית גרסאות</h2>
    <div class="versions" id="versionsList"></div>
  </section>

  <footer>
    <p>נוצר ומתוחזק על ידי צוות הסוכנים · <span id="generated"></span></p>
    <p>עדכון: הוסף רשומה ל-<code>VERSIONS</code> בקובץ <code>versions.html</code> בכל גרסה חדשה.</p>
  </footer>
</main>

<script>
/* ===== מקור הנתונים — לעדכן בכל גרסה חדשה ===== */
const CURRENT_VERSION = "1.1";

const VERSIONS = [
  {
    version: "1.1",
    date: "2026-10-22",
    label: "סוכנים אמיתיים, דשבורד ותיעוד מורחב",
    status: "active",
    changes: [
      "הגדרת 18 סוכנים/כובעים כקבצי .opencode/agents/*.md עם הרשאות מדויקות",
      "דף לוח סוכנים (agents-dashboard.html) — מיפוי, עבודות, תיעוד ופרומפט הפעלה",
      "כלל העברת הודעות סוכן משנה אל המשתמש (Relay to User) ב-AGENTS.md ובכלל הראשי",
      "דף מעקב גרסאות וגיבויים (versions.html)",
      "העברת דשבורדים פנימיים ל-internal/ עם הפניות מהשורש",
      "עדכון sw.js ל-v2 לטעינת עובדות 'הידעת?' במצב לא מקוון"
    ],
    backup: "backups/v1.1-2026-10-22",
    commit: "14ea59d",
    note: "גרסה זו מאגדת את כל עבודת היום: סוכנים, תיעוד, בטא ומובייל. פורסמה ל-GitHub Pages."
  },
  {
    version: "1.0",
    date: "2026-10-22",
    label: "השקה ראשונה של האתר הציבורי",
    status: "archived",
    changes: [
      "2,424 רחובות · 95 שכונות · מפה אינטראקטיבית (Leaflet + גיבוי קנבס)",
      "PWA מלא: manifest, Service Worker, התקנה, safe-area",
      "כרטיסיות 'הידעת?' (53 עובדות) עם מטמון offline",
      "גיימיפיקציה: 18 הישגים, יומן ביקורים, דירוג, חיווי קולי",
      "בטא נפרדת (beta.html) עם אחסון מבודד"
    ],
    backup: "backups/jlm-20261021-1792577706747",
    commit: "2563daa",
    note: "נקודת הבסיס — האתר שהיה חי לפני עבודת הסוכנים של היום."
  }
];

/* ===== רינדור ===== */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const cur = VERSIONS.find(v => v.version === CURRENT_VERSION) || VERSIONS[0];
  document.getElementById("currentVersion").textContent = "v" + cur.version;
  document.getElementById("currentMeta").textContent = cur.label + " · " + cur.date;

  const list = document.getElementById("versionsList");
  list.innerHTML = VERSIONS.map(v => {
    const pill = v.status === "active"
      ? '<span class="pill pill--active">פעיל</span>'
      : '<span class="pill pill--archived">ארכיון</span>';
    return `
    <article class="version" aria-label="גרסה ${esc(v.version)}">
      <div class="version__head">
        <span class="version__num">v${esc(v.version)}</span>
        <span class="version__label">${esc(v.label)}</span>
        <span class="version__date">${esc(v.date)}</span>
        ${pill}
      </div>
      <ul class="version__changes">
        ${v.changes.map(c => `<li>${esc(c)}</li>`).join("")}
      </ul>
      <div class="version__meta">
        <span>📦 גיבוי: <code>${esc(v.backup)}</code></span>
        <span>🔖 commit: <code>${esc(v.commit)}</code></span>
      </div>
      ${v.note ? `<p style="margin:.6rem 0 0; font-size:.9rem; color:var(--muted);">${esc(v.note)}</p>` : ""}
    </article>`;
  }).join("");

  document.getElementById("generated").textContent = "עודכן: " + new Date().toISOString().slice(0, 10);
}

render();
</script>
</body>
</html>
