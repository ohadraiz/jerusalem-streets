<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b5601f" />
    <title>ירושלים ברגל — יומן הליכות ברחובות ירושלים</title>
    <meta
      name="description"
      content="יומן הליכות חינמי ל־2,424 רחובות ב־95 שכונות בירושלים: מסמנים בדרך את הרחובות שצעדתם בהם, מוסיפים תאריך והערה ורואים התקדמות לפי שכונה. ללא הרשמה."
    />
    <!--
      דף הכניסה של האתר (/). אין בו תוכן אמיתי — רק הפניה חד-פעמית:
      מבקרים מנותבים ל-welcome.html, והתקנות PWA במצב standalone ל-app.html.
      לכן הוא אינו לאינדוקס: שתי הכתובות האמיתיות (welcome.html, app.html)
      רשומות ב-sitemap.xml וכל אחת מהן מצהירה canonical לעצמה.
    -->
    <meta name="robots" content="noindex,follow" />
    <meta name="author" content="אהד רייז" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ירושלים ברגל" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="ירושלים ברגל — יומן הליכות ברחובות ירושלים" />
    <meta
      property="og:description"
      content="סמנו את הרחובות שכבר הלכתם בהם, עקבו אחרי ההתקדמות לפי שכונה וגלו את הסיפור שמאחורי השמות. 2,424 רחובות, ללא הרשמה."
    />
    <meta property="og:url" content="https://ohadraiz.github.io/jerusalem-streets/welcome.html" />
    <meta property="og:image" content="https://ohadraiz.github.io/jerusalem-streets/assets/screenshots/jlm-desktop.png" />
    <meta property="og:image:alt" content="צילום מסך של היומן: כותרת, סרגל התקדמות, סינון לפי שכונה וסטטיסטיקות." />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ירושלים ברגל — יומן הליכות ברחובות ירושלים" />
    <meta name="twitter:image" content="https://ohadraiz.github.io/jerusalem-streets/assets/screenshots/jlm-desktop.png" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <noscript><meta http-equiv="refresh" content="0; url=welcome.html" /></noscript>
    <style>
      /* עמוד כניסה בלבד — מוצג רק אם ההפניה לא רצה (למשל JavaScript חסום) */
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: #fbf8f3;
        color: #1f1b16;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-size: clamp(1.4rem, 4vw, 2rem);
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0.5rem 1rem;
        border: 1px solid #b5601f;
        border-radius: 0.75rem;
        color: #b5601f;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14120f;
          color: #f2eee9;
        }
        a {
          border-color: #e39a53;
          color: #e39a53;
        }
      }
    </style>
    <script>
      /* דף הכניסה של האתר: דף הבית (welcome.html) למבקרים,
         והיומן (app.html) לאפליקציה מותקנת שנפתחת במצב standalone.
         הזיהוי אינו מיותר גם כשה-start_url במניפסט הוא כבר app.html: התקנות
         ותיקות שמרו start_url של "/" ולכן עדיין נפתחות דרך הדף הזה. */
      (function () {
        var mode = window.matchMedia ? window.matchMedia("(display-mode: standalone)") : null;
        var standalone = (mode && mode.matches) || window.navigator.standalone === true;
        window.location.replace(
          (standalone ? "app.html" : "welcome.html") + window.location.search + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>ירושלים ברגל</h1>
      <p>יומן הליכות בעיר — 2,424 רחובות ב־95 שכונות.</p>
      <p><a href="welcome.html">לדף הבית</a></p>
      <p><a href="app.html">כניסה ליומן</a></p>
    </main>
  </body>
</html>
