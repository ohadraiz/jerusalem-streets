<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>מצב הסוכנים — מי עושה מה</title>
    <style>
      :root {
        --bg: #fbf8f3;
        --card: #ffffff;
        --line: #e6d9c5;
        --ink: #241d15;
        --soft: #5f5140;
        --accent: #8a4512;
        --accent-soft: #f6e3d3;
        --good: #2f7d5c;
        --good-soft: #e6f2ec;
        --warn: #8a5a00;
        --warn-soft: #fdf3dc;
        --radius: 16px;
        --shadow: 0 12px 32px rgba(60, 44, 27, 0.08);
        --font: "Segoe UI", "Arial Hebrew", "Helvetica Neue", Arial, sans-serif;
        --mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14110d;
          --card: #1c1813;
          --line: #332b21;
          --ink: #f3ece1;
          --soft: #b6a894;
          --accent: #e8a164;
          --accent-soft: #33231455;
          --good: #74c9a1;
          --good-soft: #14281f;
          --warn: #f0c070;
          --warn-soft: #2a2113;
          --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 1060px;
        margin: 0 auto;
        padding: 0 1.25rem 4rem;
      }

      header.hero {
        padding: 2.75rem 0 1.75rem;
        border-bottom: 1px solid var(--line);
        margin-bottom: 1.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-end;
        justify-content: space-between;
      }

      .eyebrow {
        margin: 0 0 0.4rem;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        letter-spacing: -0.02em;
      }

      .lead {
        margin: 0.6rem 0 0;
        color: var(--soft);
        max-width: 60ch;
      }

      .refresh {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.82rem;
        color: var(--soft);
      }

      .refresh button {
        font: inherit;
        font-weight: 700;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }

      .refresh button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .refresh button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        display: inline-block;
        background: var(--soft);
        flex: none;
      }

      .dot--active {
        background: var(--good);
        box-shadow: 0 0 0 3px var(--good-soft);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.9rem;
        margin-bottom: 1.75rem;
      }

      .summary div {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 0.85rem 1rem;
        box-shadow: var(--shadow);
      }

      .summary b {
        display: block;
        font-size: 1.5rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }

      .summary small {
        color: var(--soft);
        font-size: 0.82rem;
      }

      .agents {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1rem;
      }

      .agent {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.15rem 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .agent__head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .agent__name {
        margin: 0;
        font-size: 1.15rem;
      }

      .agent__name span {
        color: var(--soft);
        font-size: 0.8rem;
        font-family: var(--mono);
        margin-inline-start: 0.4rem;
      }

      .agent__status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.78rem;
        color: var(--soft);
        white-space: nowrap;
      }

      .agent__desc {
        margin: 0;
        color: var(--soft);
        font-size: 0.92rem;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .chip {
        font-family: var(--mono);
        font-size: 0.72rem;
        direction: ltr;
        unicode-bidi: isolate;
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 6px;
        padding: 0.15rem 0.45rem;
        white-space: pre;
      }

      .chip--model {
        background: var(--good-soft);
        color: var(--good);
      }

      .msg {
        border-top: 1px dashed var(--line);
        padding-top: 0.65rem;
        margin-top: 0.2rem;
        font-size: 0.86rem;
      }

      .msg__title {
        font-weight: 700;
        margin: 0 0 0.35rem;
      }

      .msg__body {
        margin: 0;
        color: var(--soft);
        white-space: pre-wrap;
        max-height: 9.5rem;
        overflow: hidden;
        position: relative;
      }

      .msg__body::after {
        content: "";
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 2.5rem;
        background: linear-gradient(to bottom, transparent, var(--card));
      }

      .agent__foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.8rem;
        color: var(--soft);
        margin-top: auto;
      }

      .agent__foot a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      .agent__foot a:hover {
        text-decoration: underline;
      }

      .agent--primary {
        border-inline-start: 4px solid var(--accent);
      }

      h2 {
        margin: 2.5rem 0 0.9rem;
        font-size: 1.35rem;
      }

      .board {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .board__row {
        display: grid;
        grid-template-columns: 4.2rem 1fr auto;
        gap: 0.8rem;
        align-items: baseline;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
      }

      .board__row:last-child {
        border-bottom: 0;
      }

      .board__num {
        font-family: var(--mono);
        color: var(--accent);
        font-weight: 700;
      }

      .board__route {
        display: block;
        font-size: 0.8rem;
        color: var(--soft);
      }

      .board__kind {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--warn);
        background: var(--warn-soft);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        white-space: nowrap;
      }

      .empty {
        padding: 1.2rem;
        color: var(--soft);
        margin: 0;
      }

      .error {
        border: 1px solid var(--warn);
        background: var(--warn-soft);
        border-radius: 12px;
        padding: 1rem 1.1rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      footer {
        margin-top: 3rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        font-size: 0.8rem;
        color: var(--soft);
      }

      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">לוח בקרה</p>
          <h1>מה כל סוכן עושה</h1>
          <p class="lead">
            התפקיד, ההרשאות וההודעה האחרונה של כל סוכן — ישירות מהקבצים. מתעדכן אוטומטית כל 10 שניות.
          </p>
        </div>
        <div class="refresh">
          <span id="updated">טוען…</span>
          <button type="button" id="refresh">רענן</button>
        </div>
      </header>

      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="agents" id="agents"></div>

      <h2>משימות פתוחות בלוח</h2>
      <div class="board" id="board"></div>

      <footer>
        <p>
          המקור: <code>.opencode/agents/*.md</code>, <code>docs/agents/channels/*.md</code> ו-<code>docs/agents/BOARD.md</code>.
          הדף קורא מ-<code>/api/agents</code> של השרת המקומי.
        </p>
        <p class="visually-hidden" role="status" aria-live="polite" id="live"></p>
        <p><a href="/">חזרה ליומן הרחובות</a></p>
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        var el = {
          summary: document.getElementById("summary"),
          agents: document.getElementById("agents"),
          board: document.getElementById("board"),
          updated: document.getElementById("updated"),
          refresh: document.getElementById("refresh"),
          live: document.getElementById("live")
        };

        function relative(iso) {
          if (!iso) return "אין עדיין הודעות";
          var diff = Date.now() - new Date(iso).getTime();
          if (diff < 0) diff = 0;
          var minutes = Math.round(diff / 60000);
          if (minutes < 1) return "עכשיו";
          if (minutes === 1) return "לפני דקה";
          if (minutes < 60) return "לפני " + minutes + " דקות";
          var hours = Math.round(minutes / 60);
          if (hours === 1) return "לפני שעה";
          if (hours < 24) return "לפני " + hours + " שעות";
          var days = Math.round(hours / 24);
          if (days === 1) return "אתמול";
          return "לפני " + days + " ימים";
        }

        function isActive(iso) {
          if (!iso) return false;
          return Date.now() - new Date(iso).getTime() < 15 * 60000;
        }

        function text(tag, className, content) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (content !== undefined) node.textContent = content;
          return node;
        }

        function renderSummary(data) {
          el.summary.textContent = "";
          var items = [
            { value: String(data.agents.length), label: "סוכנים מוגדרים" },
            { value: String(data.board.open.length), label: "משימות פתוחות" },
            { value: String(data.board.closedCount), label: "החלטות שנסגרו" },
            { value: relative(data.primary.lastActivity), label: "עדכון אחרון ללוח" }
          ];

          items.forEach(function (item) {
            var box = document.createElement("div");
            box.appendChild(text("b", "", item.value));
            box.appendChild(text("small", "", item.label));
            el.summary.appendChild(box);
          });
        }

        function renderAgent(agent) {
          var card = text("article", "agent" + (agent.id === "primary" ? " agent--primary" : ""));

          var head = text("div", "agent__head");
          var title = text("h3", "agent__name", agent.name);
          if (agent.id !== "primary") title.appendChild(text("span", "", agent.id));
          head.appendChild(title);

          var status = text("span", "agent__status");
          var dot = text("span", "dot" + (isActive(agent.channel && agent.channel.updatedAt) ? " dot--active" : ""));
          status.appendChild(dot);
          status.appendChild(text("span", "", relative(agent.channel && agent.channel.updatedAt)));
          head.appendChild(status);
          card.appendChild(head);

          card.appendChild(text("p", "agent__desc", agent.description || ""));

          var chips = text("div", "chips");
          if (agent.model) chips.appendChild(text("span", "chip chip--model", agent.model));
          (agent.permissions || []).forEach(function (permission) {
            chips.appendChild(text("span", "chip", permission));
          });
          card.appendChild(chips);

          if (agent.lastMessage) {
            var msg = text("div", "msg");
            msg.appendChild(text("p", "msg__title", agent.lastMessage.title));
            var body = agent.lastMessage.body || "";
            msg.appendChild(text("p", "msg__body", body.length > 420 ? body.slice(0, 420) + "…" : body));
            card.appendChild(msg);
          }

          var foot = text("div", "agent__foot");
          foot.appendChild(
            text("span", "", agent.channel ? agent.channel.count + " הודעות בערוץ" : "כותב ישירות ללוח")
          );
          if (agent.channel) {
            var link = text("a", "", "קובץ מלא");
            link.href = agent.channel.path;
            link.target = "_blank";
            link.rel = "noopener";
            foot.appendChild(link);
          }
          card.appendChild(foot);

          return card;
        }

        function renderBoard(board) {
          el.board.textContent = "";
          if (board.open.length === 0) {
            el.board.appendChild(text("p", "empty", "אין משימות פתוחות."));
            return;
          }

          board.open.forEach(function (entry) {
            var row = text("div", "board__row");
            row.appendChild(text("span", "board__num", "#" + entry.number));

            var body = text("div");
            body.appendChild(text("span", "", entry.kind || "משימה"));
            if (entry.route) body.appendChild(text("span", "board__route", entry.route));
            row.appendChild(body);

            row.appendChild(text("span", "board__kind", "פתוח"));
            el.board.appendChild(row);
          });
        }

        function renderError(message) {
          el.agents.textContent = "";
          var box = text("div", "error");
          box.appendChild(text("strong", "", "לא ניתן לטעון את מצב הסוכנים"));
          box.appendChild(text("p", "", message));
          el.agents.appendChild(box);
        }

        var timer = 0;

        function load(isManual) {
          window.clearTimeout(timer);
          fetch("/api/agents", { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.json();
            })
            .then(function (data) {
              renderSummary(data);
              el.agents.textContent = "";

              var primary = {
                id: "primary",
                name: data.primary.name,
                description: data.primary.description,
                model: "מתזמן · מיישם",
                permissions: ["כותב BOARD.md", "מפעיל סוכנים"],
                channel: null,
                lastMessage: null
              };
              el.agents.appendChild(renderAgent(primary));
              data.agents.forEach(function (agent) {
                el.agents.appendChild(renderAgent(agent));
              });

              renderBoard(data.board);
              el.updated.textContent = "עודכן " + relative(data.generatedAt);
              if (isManual) el.live.textContent = "המצב רוענן";
            })
            .catch(function (error) {
              renderError(error.message);
              el.updated.textContent = "שגיאה";
            })
            .finally(function () {
              timer = window.setTimeout(load, 10000);
            });
        }

        el.refresh.addEventListener("click", function () {
          load(true);
        });

        load(false);
      })();
    </script>
  </body>
</html>
